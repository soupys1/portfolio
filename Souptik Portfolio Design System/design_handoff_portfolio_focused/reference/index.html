<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Souptik Sinha — Selected Work</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  :root {
    --rail: 1400px;
    --ease: cubic-bezier(0.4, 0, 0.2, 1);
    --mono: ui-monospace, SFMono-Regular, Menlo, "Roboto Mono", monospace;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--black);
    color: var(--white);
    font-family: var(--font-sans, Inter), system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  ::selection { background: var(--white-20); color: #fff; }

  .rail { width: 100%; max-width: var(--rail); margin: 0 auto; padding: 0 48px; }

  .grad-text {
    background: var(--gradient-text);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
  }
  .mono {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.04em;
    text-transform: lowercase;
    color: var(--white-50);
    font-variant-numeric: tabular-nums;
  }
  em { font-style: italic; }

  /* ---- entrance: transform-only (opacity stays 1) so content is never
         stuck hidden if the animation timeline is throttled ---- */
  @keyframes dsRise { from { transform: translateY(26px); } to { transform: none; } }

  /* ---- marquee ---- */
  @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-26px); } }

  @media (prefers-reduced-motion: reduce) {
    .ds-reveal { animation: none !important; }
    .marquee-track { animation: none !important; }
    .mote { animation: none !important; }
  }

  @media (max-width: 900px) {
    .rail { padding: 0 24px; }
    .nav-links { display: none !important; }
    .work-cursor { display: none !important; }
    .work-thumb { display: block !important; }
    .work-meta { display: none !important; }
  }
  @media (max-width: 560px) {
    h1 { line-height: 0.96 !important; }
    .nav-time span:first-child { display: none !important; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react" src="app.jsx"></script>
</body>
</html>
